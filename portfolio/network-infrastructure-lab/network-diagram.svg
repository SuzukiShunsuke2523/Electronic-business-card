<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Network Infrastructure Labの論理構成図</title><desc id="desc">R1 2911 routerからSW1 2960 switchへ802.1Q trunk接続。社員VLAN10、サーバーVLAN20、ゲストVLAN30がそれぞれアクセスポートで接続される。</desc><defs><style>text{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#19344b}.node{fill:#fff;stroke:#91adc4;stroke-width:2}.label{font-size:17px;font-weight:700}.sub{font-size:13px;fill:#536d84}.line{fill:none;stroke:#668da8;stroke-width:3}.head{fill:#eaf2f8}</style></defs><rect width="1000" height="560" rx="22" fill="#f3f7fb"/><rect x="365" y="18" width="270" height="108" rx="14" class="node"/><text x="500" y="49" font-size="16" text-anchor="middle" font-weight="700">R1｜Cisco 2911</text><text x="500" y="74" class="sub" text-anchor="middle">Router-on-a-Stick / ACL</text><text x="500" y="97" class="sub" text-anchor="middle">Gi0/0.10 / .20 / .30</text><path d="M500 126V191" class="line"/><rect x="380" y="143" width="240" height="34" rx="10" class="head"/><text x="500" y="165" class="sub" text-anchor="middle">802.1Q Trunk｜Native 999</text><rect x="365" y="190" width="270" height="93" rx="14" class="node"/><text x="500" y="222" class="label" text-anchor="middle">SW1｜Cisco 2960</text><text x="500" y="247" class="sub" text-anchor="middle">Gi0/1 → R1 Gi0/0</text><text x="500" y="267" class="sub" text-anchor="middle">Access VLAN 10 / 20 / 30</text><path d="M500 283 V323 H120 V358 M500 323 H370 V358 M500 323 H630 V358 M500 323 H880 V358" class="line"/><g><rect x="16" y="357" width="210" height="151" rx="14" class="node"/><text x="121" y="385" class="label" text-anchor="middle">PC-STAFF</text><text x="121" y="411" class="sub" text-anchor="middle">VLAN 10 / Fa0/1</text><text x="121" y="438" class="sub" text-anchor="middle">192.168.10.10</text><text x="121" y="462" class="sub" text-anchor="middle">GW 192.168.10.1</text><rect x="32" y="482" width="177" height="17" rx="7" fill="#dcecf8"/></g><g><rect x="265" y="357" width="210" height="151" rx="14" class="node"/><text x="370" y="385" class="label" text-anchor="middle">SERVER-WEB</text><text x="370" y="411" class="sub" text-anchor="middle">VLAN 20 / Fa0/2</text><text x="370" y="438" class="sub" text-anchor="middle">192.168.20.10</text><text x="370" y="462" class="sub" text-anchor="middle">GW 192.168.20.1</text><rect x="281" y="482" width="177" height="17" rx="7" fill="#d4eede"/></g><g><rect x="525" y="357" width="210" height="151" rx="14" class="node"/><text x="630" y="385" class="label" text-anchor="middle">PC-GUEST</text><text x="630" y="411" class="sub" text-anchor="middle">VLAN 30 / Fa0/3</text><text x="630" y="438" class="sub" text-anchor="middle">192.168.30.10</text><text x="630" y="462" class="sub" text-anchor="middle">GW 192.168.30.1</text><rect x="541" y="482" width="177" height="17" rx="7" fill="#f7e7d4"/></g><g><rect x="774" y="357" width="210" height="151" rx="14" class="node"/><text x="879" y="385" class="label" text-anchor="middle">SERVER-TEST</text><text x="879" y="411" class="sub" text-anchor="middle">VLAN 20 / Fa0/4</text><text x="879" y="438" class="sub" text-anchor="middle">192.168.20.20</text><text x="879" y="462" class="sub" text-anchor="middle">GW 192.168.20.1</text><rect x="790" y="482" width="177" height="17" rx="7" fill="#d4eede"/></g><text x="500" y="540" font-size="12" fill="#60788d" text-anchor="middle">独立設計・Packet Tracer検証構成｜閉域ラボ、インターネット接続なし</text></svg>