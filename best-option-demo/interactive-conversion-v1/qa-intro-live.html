<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LUNOA Intro Live Timeline QA</title><style>
body{background:#f3f5ee;color:#294837;font:14px/1.5 system-ui,sans-serif;margin:0;padding:18px}.panel{max-width:900px;margin:auto}h1{font-size:24px;margin-bottom:8px}#status{font-weight:800;background:white;padding:15px;border-radius:7px}.columns{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;margin-top:16px}iframe{display:block;width:min(390px,100%);height:680px;border:2px solid #c1d1c3;border-radius:8px;background:white}pre{font:11px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border:1px solid #c5d8c8;border-radius:8px}.ok{color:#14774b}.bad{color:#b53524}@media(max-width:760px){.columns{grid-template-columns:1fr}}
</style></head><body><div class="panel"><h1>見た目が本当に変わるか｜オープニング時間軸QA</h1><p>390px幅のサイトをこの画面内に表示した状態で再生し、0秒・約4.8秒・6秒・7.2秒・9秒・11.6秒の透明度を測り、3つの丸い要素が別々に登場するか確認します。</p><div id="status">準備中…</div><div class="columns"><iframe id="preview" title="LUNOA 390px動画演出の検証" src="./index.html?qa-intro-live=1"></iframe><pre id="result">計測中…</pre></div></div><script>
(async()=>{
const frame=document.getElementById("preview"),status=document.getElementById("status"),report=document.getElementById("result");
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
await new Promise(resolve=>{if(frame.contentDocument?.readyState==="complete")return resolve();frame.onload=resolve;});
const win=frame.contentWindow,doc=frame.contentDocument;
for(let i=0;i<100&&doc.documentElement.dataset.introReady!=="true";i++)await sleep(70);
const replay=doc.getElementById("intro-replay");
const badges=[...doc.querySelectorAll(".intro-feature")];
const photo=doc.querySelector(".motion-hero-photo");
const cta=doc.querySelector(".hero-cta-row");
function opacity(el){return Number(win.getComputedStyle(el).opacity);}
function state(){
 return {
   badges:badges.map(opacity).map(n=>Number(n.toFixed(2))),
   badgeAnimationDelays:badges.map(el=>parseFloat(win.getComputedStyle(el).animationDelay)),
   photoOpacity:Number(opacity(photo).toFixed(2)),
   photoTransform:win.getComputedStyle(photo).transform,
   ctaOpacity:Number(opacity(cta).toFixed(2)),
   status:doc.documentElement.dataset.introMode,
   done:doc.documentElement.dataset.introFinished
 };
}
replay.click();
const start=state();
await sleep(4770);const first=state();
await sleep(1220);const second=state();
await sleep(1230);const third=state();
await sleep(1780);const afterPhoto=state();
await sleep(2600);const end=state();
const checks={
 ready:doc.documentElement.dataset.introReady==="true",
 distinctStart:first.badges[0]>.1&&first.badges[0]<1&&first.badges[1]<.05&&first.badges[2]<.05,
 oneByOne:second.badges[0]>.95&&second.badges[1]>.1&&second.badges[1]<1&&second.badges[2]<.05,
 thirdLater:third.badges[0]>.95&&third.badges[1]>.95&&third.badges[2]>.1&&third.badges[2]<1,
 photoLater:afterPhoto.photoOpacity>.95,
 allVisible:end.badges.every(v=>v>.95)&&end.photoOpacity>.95&&end.ctaOpacity>.95,
 badgeIntervals:start.badgeAnimationDelays[1]-start.badgeAnimationDelays[0]>=1.1&&start.badgeAnimationDelays[2]-start.badgeAnimationDelays[1]>=1.1,
 replayStarted:start.status==="manual"
};
const pass=Object.values(checks).every(Boolean);
status.className=pass?"ok":"bad";
status.textContent=pass?"PASS：3つの丸い要素が別々にゆっくり登場":"FAIL：下記の詳細を確認";
report.textContent=JSON.stringify({checks,start,first,second,third,afterPhoto,end},null,2);
doc.documentElement.dataset.liveTimelineChecked="true";
document.documentElement.dataset.qaComplete="true";
window.LUNOA_LIVE_TIMELINE={checks,start,first,second,third,afterPhoto,end,passed:pass};
})();
</script></body></html>
