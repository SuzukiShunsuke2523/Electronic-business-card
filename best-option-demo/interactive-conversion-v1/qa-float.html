<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNOA｜ぽわぁ選択演出 QA</title>
<style>body{margin:0;padding:20px;background:#edf2e8;color:#254534;font:14px/1.5 system-ui,sans-serif}h1{font-size:22px}#status{background:white;padding:14px;border-radius:8px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;margin-top:16px}.card{background:white;padding:14px;border:1px solid #c6d9c7;border-radius:8px}.ok{color:#14744b}.bad{color:#a32d26}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 monospace}.hide{position:absolute;left:-15000px;top:0;pointer-events:none}</style>
</head><body><h1>選択すると下から浮かび上がる｜4画面幅QA</h1><p>金額が動かず即時に正しい値へ変わり、プラン名・説明・選択マークが約1.2秒かけて上へ浮かび上がるかを検証します。FAQの従来動作も確認。</p><div id="status">検証中…</div><div class="grid" id="cards"></div><div class="hide" id="frames"></div><script>
(async()=>{
const sleep=ms=>new Promise(ok=>setTimeout(ok,ms)),widths=[320,390,768,1280],records=[];
async function probe(width){
 const f=document.createElement('iframe');f.width=width;f.height=800;f.style.width=width+'px';f.style.height='800px';f.title=width+'px';
 const loaded=new Promise((ok,fail)=>{f.onload=ok;f.onerror=()=>fail(new Error('iframe load failed'))});f.src='./index.html?qa-float=1';document.getElementById('frames').append(f);await loaded;
 const w=f.contentWindow,d=w.document,$=sel=>d.querySelector(sel),checks={},detail={};
 for(let i=0;i<80&&!(d.documentElement.dataset.ready==='true'&&d.documentElement.dataset.motionRebuildReady==='true');i++)await sleep(100);
 checks.ready=d.documentElement.dataset.ready==='true'&&d.documentElement.dataset.motionRebuildReady==='true';
 const title=$('#selected-title'),desc=$('#selected-description'),yen=$('#selected-price'),ticket=$('[data-plan="ticket"]'),label=ticket.querySelector('[data-choice-label]');
 const oldTitle=title.textContent;
 ticket.click();
 checks.titleImmediateCorrect=title.textContent==='4回チケット';
 checks.amountImmediateCorrect=yen.textContent.trim().startsWith('¥26,000');
 checks.selectionAccessible=ticket.getAttribute('aria-pressed')==='true';
 const ghost=$('.selection-copy-ghost');
 checks.outgoingGhost=!!ghost&&ghost.textContent===oldTitle;
 const sample=()=>({titleOpacity:Number(w.getComputedStyle(title).opacity),titleTransform:w.getComputedStyle(title).transform,descOpacity:Number(w.getComputedStyle(desc).opacity),labelOpacity:Number(w.getComputedStyle(label).opacity),price:yen.textContent.trim()});
 const first=sample();
 await sleep(330);const middle=sample();await sleep(1050);const last=sample();
 detail.motion={first,middle,last};
 checks.labelRisesSlowly=first.labelOpacity<.3&&middle.labelOpacity>first.labelOpacity+.1&&middle.labelOpacity<.97&&last.labelOpacity>.97;
 checks.summaryRisesSlowly=first.titleOpacity<.25&&middle.titleOpacity>first.titleOpacity+.1&&middle.titleOpacity<.95&&last.titleOpacity>.97;
 checks.descriptionRisesSlowly=first.descOpacity<.25&&middle.descOpacity>first.descOpacity+.06&&last.descOpacity>.97;
 checks.yenDoesNotAnimate=[first.price,middle.price,last.price].every(v=>v.startsWith('¥26,000'));
 const chooseSingle=$('[data-plan="single"]');chooseSingle.click();checks.secondChoice=yen.textContent.trim().startsWith('¥7,000')&&chooseSingle.getAttribute('aria-pressed')==='true';
 const faq=$('#faq details');faq.querySelector('summary').click();await sleep(1050);checks.faqStillOpens=faq.open===true;faq.querySelector('summary').click();await sleep(1050);checks.faqStillCloses=faq.open===false;
 checks.noOverflow=d.documentElement.scrollWidth<=width+3;
 checks.noForms=d.querySelectorAll('form').length===0;
 const passed=Object.values(checks).every(Boolean);f.remove();return {width,passed,checks,detail};
}
for(const width of widths){try{records.push(await probe(width))}catch(e){records.push({width,passed:false,error:String(e)})}}
for(const entry of records){const card=document.createElement('div');card.className='card';const h=document.createElement('h2');h.textContent=entry.width+'px '+(entry.passed?'PASS':'FAIL');h.className=entry.passed?'ok':'bad';const pre=document.createElement('pre');pre.textContent=JSON.stringify(entry,null,2);card.append(h,pre);document.getElementById('cards').append(card)}
const pass=records.every(x=>x.passed),s=document.getElementById('status');s.textContent=pass?'PASS｜金額静止＋プラン名と説明のスローフロート＋FAQ回帰':'FAIL｜一部の項目を確認してください';s.className=pass?'ok':'bad';document.documentElement.dataset.qaComplete='true';window.LUNOA_FLOAT_QA=records;
})();
</script></body></html>
