<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNOA Conversion QA</title><style>body{background:#eff4ec;color:#263e31;margin:0;padding:20px;font:14px/1.6 system-ui,sans-serif}h1{font-size:23px}#status{padding:12px;background:#fff;border-radius:7px;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;margin-top:15px}.card{background:#fff;padding:15px;border:1px solid #cbdbcb;border-radius:8px}.pass{color:#157849}.fail{color:#b33423}pre{font:11px/1.4 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.offscreen{position:absolute;left:-10000px;top:0;pointer-events:none}</style></head><body><h1>集客重視デモ｜実画面・動作チェック</h1><p>320px・390px・768px・1280pxの実HTMLをiframeで読み込み、画像、横幅、料金操作、予約案内、FAQを検証します。</p><div id="status">検証中…</div><div class="cards" id="results"></div><div class="offscreen" id="frames"></div><script>
(async()=>{
const widths=[320,390,768,1280],all=[],sleep=ms=>new Promise(r=>setTimeout(r,ms)),target=document.getElementById("results");
async function test(width){
const f=document.createElement("iframe");f.width=width;f.height=820;f.style.width=width+"px";f.style.height="820px";f.title=width+"px試験";
const ready=new Promise((resolve,reject)=>{f.onload=resolve;f.onerror=()=>reject(new Error("frame load error"))});
f.src="./index.html?qa=1";document.getElementById("frames").append(f);await ready;
const w=f.contentWindow,d=w.document;
for(let n=0;n<100&&d.documentElement.dataset.ready!=="true";n++)await sleep(100);
const checks={},detail={},rects=[];
checks.jsReady=d.documentElement.dataset.ready==="true";
checks.viewport=w.innerWidth===width;
checks.noHorizontalScroll=d.documentElement.scrollWidth<=width+2;
for(const sel of [".header-inner",".hero h1",".hero-media",".hero-cta-row",".promise-grid",".experience-grid",".plan-grid",".selected-plan",".first-grid",".faq-grid",".mobile-bar"]){
const el=d.querySelector(sel);if(!el){rects.push(sel+": absent");continue}
const r=el.getBoundingClientRect();if(r.left< -4||r.right>width+4)rects.push(sel+": left="+r.left.toFixed(1)+" right="+r.right.toFixed(1));
}
checks.mainElementsFit=rects.length===0;detail.overflow=rects;detail.scrollWidth=d.documentElement.scrollWidth;
const images=[...d.querySelectorAll("img")];images.forEach(i=>i.loading="eager");
const imageResults=await Promise.all(images.map(async im=>{
try{await Promise.race([im.decode(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),16000))])}catch(e){}
return {name:im.currentSrc.split("/").slice(-2)[0],loaded:im.complete&&im.naturalWidth>0,naturalWidth:im.naturalWidth}
}));
checks.photosLoad=imageResults.length===3&&imageResults.every(x=>x.loaded);detail.photos=imageResults;
d.querySelector('[data-plan="ticket"]').click();checks.ticketPrice=d.querySelector("#selected-price").textContent.includes("26,000")&&d.querySelector('[data-plan="ticket"]').getAttribute("aria-pressed")==="true";
d.querySelector('[data-plan="single"]').click();checks.singlePrice=d.querySelector("#selected-price").textContent.includes("7,000");
d.querySelector('[data-open-guide]').click();checks.dialogOpen=d.querySelector("#booking-dialog").open&&d.querySelector("#guide-plan").textContent.includes("7,000");
d.querySelector('[data-close-guide]').click();checks.dialogClosed=!d.querySelector("#booking-dialog").open;
const faq=d.querySelector("#faq details");faq.querySelector("summary").click();checks.faqOpens=faq.open;
checks.noSubmission=d.querySelectorAll("form").length===0;
const success=Object.values(checks).every(Boolean);
f.remove();return {width,success,checks,detail};
}
for(const width of widths){try{all.push(await test(width))}catch(error){all.push({width,success:false,error:String(error)})}}
for(const entry of all){const div=document.createElement("div");div.className="card";const h=document.createElement("h2");h.textContent=entry.width+"px "+(entry.success?"PASS":"FAIL");h.className=entry.success?"pass":"fail";const p=document.createElement("pre");p.textContent=JSON.stringify(entry,null,2);div.append(h,p);target.append(div)}
const passed=all.every(x=>x.success);document.getElementById("status").innerHTML=passed?"<span class='pass'>PASS｜4画面幅・写真・料金操作・予約案内・FAQ 全合格</span>":"<span class='fail'>FAIL｜要確認の項目があります</span>";
document.documentElement.dataset.qaComplete="true";window.CONVERSION_QA=all;
})();
</script></body></html>
